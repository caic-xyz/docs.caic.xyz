# CI workflow: format, lint, and build the documentation site.
name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v2
        with:
          runtime: node@26
          cache: true
          install: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"
      - run: python -m pip install --disable-pip-version-check ruff==0.16.8
      - run: pnpm install --frozen-lockfile
      - name: Install shfmt
        run: |
          curl -fsSL -o /tmp/shfmt https://github.com/mvdan/sh/releases/download/v3.14.1/shfmt_v3.14.1_linux_amd64
          echo "76e77641faa025814b77f153b29796b8e6fa2fca03e0c76a691608b86c7ea7bf  /tmp/shfmt" | sha256sum -c -
          sudo install -m 0755 /tmp/shfmt /usr/local/bin/shfmt
      - run: pnpm verify
      - run: pnpm build
