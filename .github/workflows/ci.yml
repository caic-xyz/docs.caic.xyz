# CI workflow: format, lint, and build the documentation site.
name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v3
        with:
          runtime: node@26
          cache: true
          require-lockfile: true
      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - run: pnpm verify
      - run: pnpm build
