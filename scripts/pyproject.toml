[project]
name = "caic-docs-scripts"
version = "0.0.1"
requires-python = ">=3.12"
dependencies = ["pexpect"]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "lf"
