[project]
name = "caic-docs-scripts"
version = "0.0.1"
requires-python = ">=3.12"
dependencies = ["pexpect"]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "lf"

# The directory ships no Python package: uv only resolves the pexpect pin used by
# the demo recorder, so it must never build or install this directory. Without
# `package = false`, uv falls back to setuptools discovery, which packages hooks/
# (shell scripts) as a Python distribution.
[tool.uv]
package = false
